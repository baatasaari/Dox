[tool.poetry]
name = "dox"
version = "0.1.0"
description = "Agent Governance & Drift Observatory — runtime governance control plane for agentic AI systems"
authors = ["Dox Team"]
readme = "README.md"
packages = [
    { include = "app" },
    { include = "common" },
    { include = "dox_sdk", from = "sdk/python" },
    { include = "services" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "0.115.12"
uvicorn = { extras = ["standard"], version = "0.34.3" }
pydantic = "2.11.5"
pydantic-settings = "2.9.1"
sqlalchemy = { extras = ["asyncio"], version = "2.0.41" }
alembic = "1.16.1"
asyncpg = "0.30.0"
httpx = "0.28.1"
python-jose = { extras = ["cryptography"], version = "3.5.0" }
passlib = { extras = ["bcrypt"], version = "1.7.4" }
redis = { extras = ["hiredis"], version = "5.3.0" }
structlog = "25.3.0"
opentelemetry-sdk = "1.33.1"
opentelemetry-api = "1.33.1"
langgraph = "0.4.8"
langchain-core = "0.3.63"

[tool.poetry.group.dev.dependencies]
pytest = "8.3.5"
pytest-asyncio = "0.25.3"
pytest-cov = "6.1.0"
pytest-httpx = "0.35.0"
ruff = "0.11.11"
mypy = "1.16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=app --cov=common --cov=dox_sdk --cov=services --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
